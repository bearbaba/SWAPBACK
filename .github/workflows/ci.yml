name: Exchange acceptance
on:
  push:
    branches: [main, 'build/**']
  pull_request:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: python3 -m py_compile contracts/*.py
